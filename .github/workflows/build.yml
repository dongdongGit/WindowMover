name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Get version
        id: get_version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like "refs/tags/*") {
            $version = $env:GITHUB_REF -replace "refs/tags/", ""
          } else {
            $version = "latest"
          }
          Write-Output "version=$version" >> $env:GITHUB_OUTPUT

      # === 核心修复：自动寻找 .csproj 文件 ===
      # 解决 MSB1009 和 MSB1003 错误，无论项目在哪都能找到
      - name: Locate Project File
        id: locate_project
        shell: pwsh
        run: |
          $csproj = Get-ChildItem -Recurse -Filter "*.csproj" | Select-Object -First 1
          if ($null -eq $csproj) { 
            Write-Error "❌ 致命错误：找不到 .csproj 文件！"
            exit 1 
          }
          echo "PROJECT_PATH=$($csproj.FullName)" >> $env:GITHUB_ENV
          Write-Host "✅ 已找到项目文件: $($csproj.FullName)"

      - name: Restore dependencies
        run: dotnet restore "${{ env.PROJECT_PATH }}"

      # === 编译命令：生成依赖版和独立版 ===
      
      - name: Publish All Variants
        shell: pwsh
        run: |
          $archs = "win-x64", "win-x86", "win-arm64"
          foreach ($arch in $archs) {
            # 1. Framework Dependent (需要安装 .NET Runtime, 体积小)
            Write-Host "Publishing $arch Framework Dependent..."
            dotnet publish "${{ env.PROJECT_PATH }}" -c Release -r $arch -p:SelfContained=false -p:PublishSingleFile=true -p:DebugType=None -o "publish/net8/$arch"
            
            # 2. Self Contained (独立运行, 无需安装环境, 体积大)
            Write-Host "Publishing $arch Self Contained..."
            dotnet publish "${{ env.PROJECT_PATH }}" -c Release -r $arch -p:SelfContained=true -p:PublishSingleFile=true -p:DebugType=None -o "publish/standalone/$arch"
          }

      # 打包
      - name: Create ZIP archives
        shell: pwsh
        run: |
          $ver = "${{ steps.get_version.outputs.version }}"
          $archs = "win-x64", "win-x86", "win-arm64"
          
          foreach ($arch in $archs) {
            # 打包 Framework Dependent
            $srcNet8 = "publish/net8/$arch/*"
            $destNet8 = "WindowMover-$arch-net8-$ver.zip"
            Compress-Archive -Path $srcNet8 -DestinationPath $destNet8
            
            # 打包 Self Contained
            $srcStandalone = "publish/standalone/$arch/*"
            $destStandalone = "WindowMover-$arch-standalone-$ver.zip"
            Compress-Archive -Path $srcStandalone -DestinationPath $destStandalone
          }

      # 发布
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            WindowMover-*-net8-*.zip
            WindowMover-*-standalone-*.zip
          name: Release ${{ steps.get_version.outputs.version }}
          body: |
            ## Window Mover ${{ steps.get_version.outputs.version }}
            
            ### 📥 下载选择 (Download Options)
            
            #### 1. 独立版 (Standalone) - ✅ 推荐
            > **无需安装** 任何环境，解压即用。体积较大。
            - 💻 **64位 (通用)**: 下载 `...-win-x64-standalone-....zip`
            - 🖥️ **32位**: 下载 `...-win-x86-standalone-....zip`
            - 📱 **ARM64**: 下载 `...-win-arm64-standalone-....zip`
            
            #### 2. 依赖版 (.NET 8 Required) - ⚡ 轻量
            > **需要安装** [.NET 8.0 Desktop Runtime](https://dotnet.microsoft.com/download/dotnet/8.0)。体积非常小。
            - 💻 **64位**: 下载 `...-win-x64-net8-....zip`
            - 🖥️ **32位**: 下载 `...-win-x86-net8-....zip`
            - 📱 **ARM64**: 下载 `...-win-arm64-net8-....zip`

            #### 3. macOS (Native)
            > **原生 Swift 开发**，支持 macOS 10.13+
            - 🍎 **Apple Silicon (M1/M2/M3)**: 下载 `...-macOS-arm64-....zip`
            - 🖥️ **Intel**: 下载 `...-macOS-x86_64-....zip`
            - 🌐 **通用版 (Universal)**: 下载 `...-macOS-universal-....zip`
            
            ### 使用方法
            1. 下载对应版本并解压
            2. 运行 `WindowMover.exe`
            3. 右键托盘图标可设置开机自启
            
            ---
            *Automated build*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [arm64, x86_64, universal]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version
        id: get_version
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
          else
            VERSION="latest"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build macOS App (${{ matrix.arch }})
        run: |
          cd WindowMoverMac
          make bundle-${{ matrix.arch }}

      - name: Create ZIP archive
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          cd WindowMoverMac
          zip -r ../WindowMover-macOS-${{ matrix.arch }}-$VERSION.zip WindowMover.app

      - name: Upload Release Asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: WindowMover-macOS-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}